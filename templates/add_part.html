<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление запчасти</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .navbar a:hover { text-decoration: underline; }
        .navbar .active { font-weight: bold; border-bottom: 2px solid white; }
        

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #333; }
        

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 80px; }
        

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }


        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }
        .alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>


    <div class="navbar">
        <a href="/dashboard">Дашборд директора</a>
        <a href="/catalog" class="active">Каталог</a>
        <a href="/directory">Справочник</a>
        <a href="/cart">Корзина</a>
    </div>

    <div class="container">
        <h2>Добавление новой запчасти</h2>


        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" action="/parts/add">
            <div class="form-group">
                <label>Артикул</label>
                <input type="text" name="article" placeholder="Например: A-1024" required>
            </div>

            <div class="form-group">
                <label>Наименование</label>
                <input type="text" name="name" placeholder="Например: Тормозная колодка" required>
            </div>

            <div class="form-group">
                <label>Бренд</label>
                <select name="brand_id" required>
                    <option value="">— выберите бренд —</option>
                    {% for b in brands %}
                        <option value="{{ b.id }}">{{ b.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Категория</label>
                <select name="category_id" required>
                    <option value="">— выберите категорию —</option>
                    {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Цена, руб.</label>
                <input type="text" name="price" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Остаток, шт.</label>
                <input type="number" name="stock" placeholder="10" required>
            </div>

            <div class="form-group">
                <label>Описание</label>
                <textarea name="description" placeholder="Введите описание запчасти..."></textarea>
            </div>

            <button type="submit">Сохранить в каталог</button>
        </form>
    </div>

</body>
</html>
